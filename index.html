<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuseScore Studio web builds</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f4f2;
    --surface-1: #fcfcfb;
    --line: #e2e1dc;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #6f6e69;
    --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #121211;
      --surface-1: #1a1a19;
      --line: #2e2e2c;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #9a998f;
      --accent: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --line: #2e2e2c;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #9a998f;
    --accent: #3987e5;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-0);
    color: var(--text-primary);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 48px; }
  a { color: var(--accent); }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .sub { color: var(--text-secondary); margin: 0 0 24px; }
  .card {
    background: var(--surface-1);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .num { font-variant-numeric: tabular-nums; }

  .hero { display: flex; flex-wrap: wrap; gap: 16px 40px; align-items: flex-end; }
  .stat .label { color: var(--text-secondary); font-size: 13px; }
  .stat .value { font-size: 32px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; }
  .stat .value.small { font-size: 20px; }
  .hero .meta { margin-left: auto; text-align: right; color: var(--text-secondary); font-size: 13px; }
  .button {
    display: inline-block; margin-top: 8px; padding: 7px 14px; border-radius: 7px;
    background: var(--accent); color: #fff; text-decoration: none; font-weight: 500;
  }
  .button[aria-disabled="true"] { opacity: .4; pointer-events: none; }
  .empty { color: var(--text-secondary); padding: 24px 0; text-align: center; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { color: var(--text-secondary); font-weight: 500; }
  footer { color: var(--text-muted); font-size: 12.5px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>MuseScore Studio web builds</h1>
  <p class="sub">Web (wasm) build of <a href="https://github.com/musescore/MuseScore">musescore/MuseScore</a>, published by the <i>Build: Wasm</i> workflow.</p>

  <section class="card hero">
    <div class="stat">
      <div class="label">Version</div>
      <div class="value num" id="hero-version">—</div>
    </div>
    <div class="stat">
      <div class="label">Branch</div>
      <div class="value small" id="hero-branch">—</div>
    </div>
    <div class="meta">
      <div id="hero-meta">No build published yet</div>
      <a class="button" id="open" href="app/viewer.html" aria-disabled="true">Open MuseScore Studio</a>
    </div>
  </section>

  <section class="card">
    <h2>Publishes</h2>
    <div class="table-wrap">
      <table id="publishes">
        <thead>
          <tr><th>Date</th><th>Version</th><th>Branch</th><th>Commit</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <footer>Data: <a href="history.csv">history.csv</a> · Only the latest build is served.</footer>
</main>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const fmtDate = (iso) => new Date(iso).toLocaleString(undefined, {
    year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
  });

  function commitLink(repo, sha) {
    if (!sha || sha === "unknown") {
      return document.createTextNode("—");
    }
    const a = document.createElement("a");
    a.href = "https://github.com/" + (repo || "musescore/MuseScore") + "/commit/" + sha;
    a.textContent = sha.slice(0, 7);
    return a;
  }

  // history.csv: date,commit,branch,version
  function parseCsv(text) {
    const lines = text.trim().split(/\r?\n/);
    const header = lines.shift().split(",");
    return lines.filter(Boolean).map((line) => {
      const cells = line.split(",");
      const row = {};
      header.forEach((h, i) => { row[h] = cells[i] || ""; });
      return row;
    }).sort((a, b) => b.date.localeCompare(a.date));
  }

  function renderBuild(build) {
    $("hero-version").textContent = build.version || "—";
    $("hero-branch").textContent = build.branch || "—";
    $("hero-meta").replaceChildren(fmtDate(build.date) + " · ", commitLink(build.repository, build.commit));
    $("open").removeAttribute("aria-disabled");
  }

  function renderPublishes(rows) {
    const body = document.querySelector("#publishes tbody");
    body.replaceChildren();
    if (!rows.length) {
      const td = document.createElement("td");
      td.colSpan = 4;
      td.className = "empty";
      td.textContent = "Nothing published yet";
      body.appendChild(document.createElement("tr")).appendChild(td);
      return;
    }
    rows.forEach((r) => {
      const tr = document.createElement("tr");
      [fmtDate(r.date), r.version || "—", r.branch || "—"].forEach((text) => {
        tr.appendChild(document.createElement("td")).textContent = text;
      });
      tr.appendChild(document.createElement("td")).appendChild(commitLink(null, r.commit));
      body.appendChild(tr);
    });
  }

  fetch("app/build.json", { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : null))
    .then((build) => { if (build) renderBuild(build); })
    .catch(() => {});

  fetch("history.csv", { cache: "no-store" })
    .then((r) => (r.ok ? r.text() : "date,commit,branch,version\n"))
    .then((text) => renderPublishes(parseCsv(text)))
    .catch(() => renderPublishes([]));
})();
</script>
</body>
</html>
